# ============================================================
#  AI 导航站 — Render 一键部署（免费套餐）
#  用法：Render 面板 → New → Blueprint → 选本仓库，会自动读取此文件
#
#  注意：Render 免费套餐的磁盘需手动在面板确认已附加（$1/月起），
#  否则 SQLite 数据会在每次重启后丢失。生产建议改用 MySQL。
# ============================================================
services:
  - type: web
    name: ai-nav-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile.api
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    disk:
      name: ai-nav-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      # SQLite 放在持久化磁盘上，重启不丢数据
      - key: DATABASE_URL
        value: "file:/data/prod.db"
      # 在 Render 面板改成 32 位以上随机字符串
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      # 部署完成后改成你的 GitHub Pages 地址，如 https://user.github.io
      - key: WEB_ORIGIN
        value: "https://example.github.io"
      # 初始管理员账号，首次 seed 用
      - key: ADMIN_USERNAME
        value: "admin"
      # 在 Render 面板改成强密码
      - key: ADMIN_PASSWORD
        value: "change-me-strong-password"
