# ============================================================
#  AI 导航站 — 本地一键部署（含 Postgres）
#  用法：docker compose up -d --build
# ============================================================
services:
  db:
    image: postgres:16-alpine
    container_name: ai-nav-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: root_change_me
      POSTGRES_DB: ai_nav
      POSTGRES_USER: ai_nav
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_nav -d ai_nav"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-nav-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      # ---- 使用 Postgres ----
      DB_PROVIDER: postgresql
      DATABASE_URL: "postgresql://ai_nav:root_change_me@db:5432/ai_nav?schema=public"
      # ---- 务必修改以下两项 ----
      JWT_SECRET: "change-me-to-a-long-random-string"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "change-me-strong-password"
      WEB_ORIGIN: "http://localhost:3001"
    ports:
      - "3001:3001"

volumes:
  pg-data:

